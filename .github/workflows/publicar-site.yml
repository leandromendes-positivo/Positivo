# Publica o painel no GitHub Pages a cada alteração no branch principal.
# Uma vez só: Settings → Pages → Source: "GitHub Actions".
name: Publicar painel

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      administrador_inicial:
        description: "E-mail do primeiro administrador (somente na ativação inicial)"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Instalar ferramentas de segurança
        working-directory: seguranca
        run: npm ci --no-audit --no-fund
      - name: Publicar e validar as regras de acesso
        working-directory: seguranca
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          INITIAL_ADMIN_EMAIL: ${{ inputs.administrador_inicial || vars.INITIAL_ADMIN_EMAIL }}
        run: node publicar.mjs
      - name: Montar o painel
        run: python3 build.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site
      - id: publicacao
        uses: actions/deploy-pages@v5
