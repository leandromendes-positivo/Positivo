# Publica o painel no GitHub Pages a cada alteração no branch principal.
# Uma vez só: Settings → Pages → Source: "GitHub Actions".
name: Publicar painel

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      administrador_inicial:
        description: "E-mail do primeiro administrador (somente na ativação inicial)"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  testar-acessos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Instalar ferramentas dos testes
        working-directory: seguranca
        run: npm ci --no-audit --no-fund
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Preparar o teste de navegador
        run: |
          ./seguranca/node_modules/.bin/playwright install --with-deps chromium firefox webkit
          mkdir -p /tmp/firebase-sdk-portal
          for sdk in app auth firestore; do
            curl --fail --silent --show-error "https://www.gstatic.com/firebasejs/10.14.1/firebase-${sdk}-compat.js" -o "/tmp/firebase-sdk-portal/firebase-${sdk}-compat.js"
          done
          python3 build.py
          python3 -m http.server 8003 --bind 127.0.0.1 --directory dist > /tmp/portal-http.log 2>&1 &
      - name: Testar separação dos estoques
        run: |
          node testes/portal-projecao.mjs
          node testes/lembretes-ferias.mjs
      - name: Testar regras reais de acesso e isolamento
        env:
          PW_PATH: ${{ github.workspace }}/seguranca
          FIREBASE_SDK_DIR: /tmp/firebase-sdk-portal
        run: ./seguranca/node_modules/.bin/firebase emulators:exec --only firestore,auth --project demo-controle-seguranca "node testes/verificar-acessos.mjs && PW_BROWSER=firefox node testes/verificar-sessao.mjs && PW_BROWSER=webkit node testes/verificar-sessao.mjs"
  publicar:
    needs: testar-acessos
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Instalar ferramentas de segurança
        working-directory: seguranca
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Publicar e validar as regras de acesso
        working-directory: seguranca
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          INITIAL_ADMIN_EMAIL: ${{ inputs.administrador_inicial || vars.INITIAL_ADMIN_EMAIL }}
        run: node publicar.mjs
      - name: Executar limpeza única autorizada das peças
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Executar limpeza autorizada das peças 2026-10-20')
        working-directory: seguranca
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          LIMPEZA_PECAS_OPERACAO: pecas-reinicio-2026-10-20
        run: node limpar-pecas.mjs
      - name: Limpar cadastro operacional remanescente autorizado
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Concluir limpeza do cadastro de peças 2026-10-20')
        working-directory: seguranca
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          LIMPEZA_CADASTRO_OPERACAO: cadastro-pecas-reinicio-2026-10-20
        run: node limpar-cadastro-pecas.mjs
      - name: Instalar serviço de lembretes
        working-directory: aviso
        run: npm ci --no-audit --no-fund
      - name: Conferir remetente e processar testes solicitados
        working-directory: aviso
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_USUARIO: ${{ secrets.GMAIL_USUARIO }}
          GMAIL_SENHA_APP: ${{ secrets.GMAIL_SENHA_APP }}
        run: node configurar-ferias.mjs
      - name: Montar o painel
        run: python3 build.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site
      - id: publicacao
        uses: actions/deploy-pages@v5
